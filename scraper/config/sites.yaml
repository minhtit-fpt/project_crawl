# Price Crawler — Site Configuration
#
# Each entry defines one target website. SKUs listed here will be expanded
# into individual crawl jobs by the scheduler.
#
# Fields:
#   name              Human-readable site label (used in output & logs)
#   base_url          URL template — {sku} is replaced with each product code
#   skus              List of product codes to crawl on this site
#   selectors:
#     price_css       Primary CSS selector for the price element
#     price_xpath     Fallback XPath selector (used if CSS yields nothing)
#   requires_js       true = render via Playwright; false = plain Scrapy request
#   rate_limit_seconds  Minimum delay (seconds) between requests to this domain
#
# SHARED SKU LIST
# ---------------
# Dùng YAML anchors để nhiều site cùng dùng một danh sách SKU.
# Khai báo anchor (&shared_skus) một lần, tham chiếu (*shared_skus) ở mỗi site.
# yaml.safe_load() resolve anchors tự động — không cần thay đổi code Python.

shared_skus: &shared_skus
  - "NIS-C18R2T28"
  - "NIS-C09R2T28"
  - "MAFA-09CDN8"

sites:
  - name: "DienmayXanh"
    # sku_mode: "search" — nhập mã sản phẩm ngắn, crawler tự tìm URL đầy đủ
    # Ví dụ: NIS-C09R2T28 → https://www.dienmayxanh.com/may-lanh/nagakawa-inverter-1-hp-nis-c09r2t28
    base_url: "https://www.dienmayxanh.com/may-lanh/{sku}"
    sku_mode: "search"
    search_url: "https://www.dienmayxanh.com/tim-kiem?key={sku}"
    search_selectors:
      result_link_css: "a.main-contain"
    skus: *shared_skus
    selectors:
      price_css: ".box_servicepack div.active span b"
      price_xpath: "//div[contains(@class,'box_servicepack')]//div[contains(@class,'active')]/span/b"
    requires_js: true
    rate_limit_seconds: 2

  - name: "NguyenKim"
    base_url: "https://www.nguyenkim.com/tim-kiem/?query={sku}"
    sku_mode: "search"
    search_url: "https://www.nguyenkim.com/tim-kiem/?query={sku}"
    search_selectors:
      result_link_css: "a.product-item-link"
    skus: *shared_skus
    selectors:
      price_css: ".product-info-price .price"
      price_xpath: "//div[contains(@class,'product-info-price')]//span[@class='price']"
    requires_js: true
    rate_limit_seconds: 2
