services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-price_crawler}
      MYSQL_USER: ${MYSQL_USER:-crawler}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crawler_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root",
             "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  crawler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: project_crawl:latest

    # Load all secrets from .env — never hardcode them here
    env_file:
      - .env

    # Mount config dir as a volume so you can change sites.yaml without rebuilding
    volumes:
      - ./scraper/config:/app/scraper/config:ro

    # Resource limits: prevent a runaway crawler from consuming the whole host
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

    # Wait until MySQL is healthy before starting the crawler
    depends_on:
      mysql:
        condition: service_healthy

    # Restart only on unexpected crashes, not on clean exit
    restart: on-failure

    # Pass CLI flags via environment variable for easy override:
    #   LOG_LEVEL=DEBUG docker-compose up
    command: >
      python main.py
      ${CRAWLER_EXTRA_ARGS:-}

  api:
    image: project_crawl:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    env_file:
      - .env

    volumes:
      - ./scraper/config:/app/scraper/config:ro

    ports:
      - "${PULL_API_PORT:-8080}:${PULL_API_PORT:-8080}"

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    command: python main.py --serve

volumes:
  mysql_data:
