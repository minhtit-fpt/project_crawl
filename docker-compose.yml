services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    env_file:
      - .env

    volumes:
      - ./scraper/config:/app/scraper/config:ro

    ports:
      - "${PULL_API_PORT:-8080}:${PULL_API_PORT:-8080}"

    # Allow container to reach MySQL running on the host (Linux Docker)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

    restart: unless-stopped

    command: python main.py --serve
